{{- $secretName := required "runner.githubConfigSecret must be the name of the GitHub App Kubernetes Secret" .Values.runner.githubConfigSecret -}}
{{- if not (kindIs "string" $secretName) -}}
{{- fail "runner.githubConfigSecret must be a Kubernetes Secret name, not inline credentials" -}}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required" .Values.externalSecret.secretStoreRef.name | quote }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | quote }}
  target:
    name: {{ $secretName | quote }}
    creationPolicy: Owner
  data:
    - secretKey: github_app_id
      remoteRef:
        {{- toYaml .Values.externalSecret.appId | nindent 8 }}
    - secretKey: github_app_installation_id
      remoteRef:
        {{- toYaml .Values.externalSecret.installationId | nindent 8 }}
    - secretKey: github_app_private_key
      remoteRef:
        {{- toYaml .Values.externalSecret.privateKey | nindent 8 }}
