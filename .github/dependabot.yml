version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: helm
    directories:
      - /arc-runner
      - /arc-controller
    schedule:
      interval: weekly
    groups:
      arc-charts:
        patterns:
          - "gha-runner-scale-set*"
