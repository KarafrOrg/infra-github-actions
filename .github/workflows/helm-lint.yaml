name: Helm lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Helm
        uses: azure/setup-helm@v5.1.0
        with:
          version: v3.17.3
      - name: Build dependencies
        run: helm dependency build arc --skip-refresh
      - name: Lint chart
        run: helm lint arc --strict
      - name: Render chart
        run: helm template arc-dind arc --namespace arc-runners > /dev/null
