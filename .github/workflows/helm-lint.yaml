name: Helm lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart: [arc-controller, arc-runner]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Helm
        uses: azure/setup-helm@v5.1.0
        with:
          version: v3.17.3
      - name: Build dependencies
        run: helm dependency build "${{ matrix.chart }}" --skip-refresh
      - name: Lint chart
        run: helm lint "${{ matrix.chart }}" --strict
      - name: Render chart
        run: helm template "${{ matrix.chart }}" "${{ matrix.chart }}" --namespace infra-github-actions --include-crds > /dev/null
